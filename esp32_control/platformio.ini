; Firmware definitivo - TPF Robotica IA
; Control de bajo nivel: protocolo serie, motores, ultrasonico, buzzer,
; watchdog y telemetria. Especificacion en PLAN.md secciones 7 y 8.
;
; NOTA: 'board' es un DevKit generico con ESP32-WROOM-32, igual que en
; esp32_motor_test. Si la placa es otra, cambiar aca.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = time, colorize

; Sin esto el monitor no muestra lo que uno tipea y probar a mano es a ciegas.
monitor_echo = yes

build_flags =
    -Wall
