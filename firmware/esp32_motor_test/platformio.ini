; Bring-up de motores — TPF Robótica IA
; Objetivo: verificar cableado, sentido de giro y rango util de PWM.
;
; NOTA: 'board' esta puesto para un DevKit generico con ESP32-WROOM-32.
; Si la placa es otra (ESP32-S3, C3, DevKitC v4, etc.) cambiar aca.
; Lista: https://docs.platformio.org/en/latest/boards/index.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = time, colorize

build_flags =
    -Wall
